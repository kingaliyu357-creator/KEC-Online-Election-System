
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEBBI ELITE CIRCLE - Online Election</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>KEBBI ELITE CIRCLE</h1>
    <p>ONLINE ELECTION SYSTEM</p>
  </header>

  <main class="container">
    <section id="apply" class="card">
      <h2>Candidate Application</h2>
      <p>Complete this form to apply for your desired position.</p>

      <form id="application-form">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required>

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" required>

        <label for="position">Position You Are Applying For</label>
        <select id="position" name="position" required>
          <option value="">Select a position</option>
          <option>President</option>
          <option>Vice President</option>
          <option>General Secretary</option>
          <option>Assistant General Secretary</option>
          <option>Treasurer</option>
          <option>Financial Secretary</option>
          <option>Public Relations Officer (PRO)</option>
          <option>Event Coordinator</option>
          <option>Welfare Officer</option>
          <option>Women Leader</option>
          <option>Assistant Women Leader</option>
          <option>First Lady</option>
          <option>Chief Protocol Officer</option>
          <option>Media and Publicity Officer</option>
        </select>

        <label for="photo">Upload Your Photograph</label>
        <input id="photo" name="photo" type="file" accept="image/*" required>

        <label for="contribution">What Will You Contribute to KEC?</label>
        <textarea id="contribution" name="contribution" rows="4" required></textarea>

        <label for="pledge">Integrity Pledge</label>
        <p>I pledge to be honest, responsible, loyal, and fair to KEC.</p>
        <label class="pledge-label">
          <input type="checkbox" name="pledge" required>
          I accept the integrity pledge.
        </label>

        <button type="submit">Submit Application</button>
      </form>

      <p id="form-message">
        Note: Application submission will be enabled after the backend is connected.
      </p>
    </section>
  </main>

  <footer>
    <p>KEBBI ELITE CIRCLE © 2026</p>
  </footer>
</body>
        </html>
